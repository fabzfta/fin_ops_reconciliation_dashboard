name: "finops"
version: "1.0.0"
config-version: 2

profile: "finops"

model-paths: ["models"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  finops:

    staging:
      +materialized: view
      +schema: staging

    core:
      +materialized: table
      +schema: core

    analytics:
      +materialized: table
      +schema: analytics

seeds:
  finops:
    +schema: test_data